  /backoffice/feedback/{feedback_id}/status:
    post:
      operationId: postBackofficeFeedbackStatus
      parameters:
      - explode: false
        in: path
        name: feedback_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
