openapi: 3.1.0
info:
  title: application
  version: 3.x
servers:
- url: https://app.gobugfree.com
security:
- bearer: []
paths:
  /account/programs/{program}/submissions/{legacy_id}:
    get:
      operationId: getAccountProgramsSubmissionsByLegacyId
      parameters:
      - explode: false
        in: path
        name: program
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: legacy_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacylinkLink"
          description: The report the id maps to
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Where an old report link that names its program leads: a redirect\
        \ to the report, or the report list for an unknown id (JSON: the target, 404\
        \ for an unknown id)"
      tags:
      - account
  /account/submissions/{legacy_id}:
    get:
      operationId: getAccountSubmissionsByLegacyId
      parameters:
