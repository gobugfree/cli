    get:
      operationId: getReports
      parameters:
      - description: Workflow states to include
        explode: true
        in: query
        name: status
        required: false
        schema:
          items:
            enum:
            - new
            - triaging
            - validated
            - accepted
            - fixed
            - closed
            - reopened
            - rejected
            - duplicate
            - draft
            type: string
          type: array
          default: null
        style: form
      - description: "Severities (assessed, else submitted) to include"
        explode: true
        in: query
        name: severity
        required: false
        schema:
          items:
            enum:
            - none
            - low
            - medium
            - high
            - critical
            type: string
          type: array
          default: null
        style: form
      - description: "Free-text search: title substring or report id prefix"
        explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - description: "Time window: a preset counted back from now, or custom with\
          \ from/to; omitted or all means no window"
        explode: true
        in: query
        name: range
        required: false
        schema:
          enum:
          - 7d
          - 30d
          - 90d
          - 12m
          - all
          - custom
          type: string
        style: form
      - description: "First day of a custom window (YYYY-MM-DD), open when omitted"
        explode: true
        in: query
        name: from
        required: false
        schema:
          type: string
        style: form
      - description: "Last day of a custom window (YYYY-MM-DD, inclusive), open when\
          \ omitted"
        explode: true
        in: query
        name: to
        required: false
        schema:
          type: string
        style: form
      - description: "Date the window applies to: submitted (default) or accepted\
          \ (the acceptance)"
        explode: true
        in: query
        name: date
        required: false
        schema:
          enum:
          - submitted
          - accepted
          type: string
        style: form
      - description: "1 keeps only the reports that need attention now: escalated,\
          \ SLA breached, or inside the last fifth of an open deadline"
        explode: true
        in: query
        name: urgent
        required: false
        schema:
          enum:
          - "1"
          type: string
        style: form
      - description: Sort key
        explode: true
        in: query
        name: sort
        required: false
        schema:
          enum:
          - submitted
          - updated
          - severity
          - title
          - engagement
          - status
          type: string
        style: form
      - description: Sort direction
        explode: true
        in: query
        name: dir
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: "Page number, from 1"
        explode: true
        in: query
        name: page
        required: false
        schema:
          type: string
        style: form
      - description: Rows per page
        explode: true
        in: query
        name: size
        required: false
        schema:
          enum:
