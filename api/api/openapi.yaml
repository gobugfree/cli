openapi: 3.1.0
info:
  title: application
  version: 3.x
servers:
- url: http://localhost:3000
security:
- bearer: []
paths:
  /advisories/{disclosure_id}:
    get:
      operationId: getAdvisoriesByDisclosureId
      parameters:
      - explode: false
        in: path
        name: disclosure_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisclosureAdvisory"
          description: The public advisory
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: The public advisory of a published disclosure; 404 until published
      tags:
      - advisories
  /badges:
    get:
      operationId: getBadges
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeCatalogItemList"
          description: Every active badge with its earned or progress state
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Achievement badge catalog of the authenticated researcher: earned\
        \ badges with their award date and visibility, locked badges with progress\
        \ toward the threshold"
      tags:
      - badges
  /badges/{code}/visibility:
    post:
      operationId: postBadgesVisibility
      parameters:
      - explode: false
        in: path
        name: code
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postBadgesVisibility_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The badge code with its new hidden state
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Hide or show one of the researcher's own earned badges on the public
        profile
      tags:
      - badges
  /conduct/status:
    get:
      operationId: getConductStatus
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: The signed-in researcher's account status and any active enforcement
      tags:
      - conduct
  /conduct/{case_id}/appeal:
    post:
      operationId: postConductAppeal
      parameters:
      - explode: false
        in: path
        name: case_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: File an appeal on a decided conduct case
      tags:
      - conduct
  /docs:
    get:
      operationId: getDocs
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApidocReference"
          description: Where the OpenAPI document and this reference live
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Interactive API reference: the caller's OpenAPI document rendered\
        \ for people, with try-it requests; JSON callers get the document locations"
      tags:
      - docs
  /engagements:
    get:
      operationId: getEngagements
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementListItemList"
          description: One directory page with the filtered total
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Engagement directory: active and paused engagements visible to the\
        \ authenticated user, filterable by kind, industry, scope type (scope), and\
        \ minimum bounty (bounty), paginated with page"
      tags:
      - engagements
  /engagements/{org_slug}/{engagement_slug}:
    get:
      operationId: getEngagementsByOrgSlugAndEngagementSlug
      parameters:
      - explode: false
        in: path
        name: org_slug
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: engagement_slug
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementDetail"
          description: The engagement detail
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Engagement detail; public engagements for any user, private ones members-only\
        \ with 404 for non-members (ADR-0009)"
      tags:
      - engagements
  /engagements/{org_slug}/{engagement_slug}/message-proxy:
    get:
      operationId: getEngagementsMessageProxy
      parameters:
      - explode: false
        in: path
        name: org_slug
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: engagement_slug
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementProxyMessageList"
          description: "The recent codes, newest first"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Authentication codes forwarded from the engagement's 2FA-protected
        test accounts within the last 15 minutes; requires testing access and accepted
        rules
      tags:
      - engagements
  /engagements/{org_slug}/{engagement_slug}/rules/accept:
    post:
      operationId: postEngagementsRulesAccept
      parameters:
      - explode: false
        in: path
        name: org_slug
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: engagement_slug
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Accept the engagement's published rules of engagement; required before\
        \ submitting reports, re-required after a new version publishes"
      tags:
      - engagements
  /engagements/{org_slug}/{engagement_slug}/submit:
    post:
      operationId: postEngagementsSubmit
      parameters:
      - explode: false
        in: path
        name: org_slug
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: engagement_slug
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postEngagementsSubmit_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
          description: The submitted report
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Create and submit a vulnerability report in one call; members and,\
        \ for active public engagements, fully onboarded researchers. 400 names the\
        \ missing fields; 409 pending_budget_exceeded keeps the content as the draft\
        \ named by draftId. To submit an existing draft use postReportsSubmit"
      tags:
      - engagements
  /engagements/{org_slug}/{engagement_slug}/submit/draft:
    post:
      operationId: postEngagementsSubmitDraft
      parameters:
      - explode: false
        in: path
        name: org_slug
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: engagement_slug
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postEngagementsSubmit_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
          description: The saved draft
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Save a private draft report; no completeness validation, only a title\
        \ is required. Submit it later with postReportsSubmit"
      tags:
      - engagements
  /feedback:
    get:
      operationId: getFeedback
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackList"
          description: The user's feedback
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: The feedback overlay and the signed-in user's earlier feedback
      tags:
      - feedback
    post:
      operationId: postFeedback
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
          description: The stored feedback
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Send product feedback
      tags:
      - feedback
  /leaderboard:
    get:
      operationId: getLeaderboard
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "The researcher leaderboard of the selected window; searchable by handle,\
        \ sortable, paginated"
      tags:
      - leaderboard
  /leaderboard/export:
    get:
      operationId: getLeaderboardExport
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Download the filtered leaderboard as CSV or JSON
      tags:
      - leaderboard
  /lists/columns:
    post:
      operationId: postListsColumns
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postListsColumns_request"
        required: true
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Save the caller's visible columns and their order for a list; reset=1
        restores the default
      tags:
      - lists
  /notifications:
    get:
      operationId: getNotifications
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageNotificationList"
          description: The user's notifications
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "The user's notifications, newest first"
      tags:
      - notifications
  /notifications/read-all:
    post:
      operationId: postNotificationsReadAll
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Mark every notification of the user as read
      tags:
      - notifications
  /notifications/{notification_id}:
    get:
      operationId: getNotificationsByNotificationId
      parameters:
      - explode: false
        in: path
        name: notification_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Open one notification: marks it read and forwards to its entity; 404\
        \ for other users' notifications (ADR-0009)"
      tags:
      - notifications
  /onboarding:
    get:
      operationId: getOnboarding
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOnboarding"
          description: The current onboarding state
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Researcher onboarding state: the current wizard step, conduct acceptance,\
        \ and completion"
      tags:
      - onboarding
  /onboarding/conduct:
    post:
      operationId: postOnboardingConduct
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postOnboardingConduct_request"
        required: true
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Onboarding step 4: accept the community guidelines and complete registration"
      tags:
      - onboarding
  /onboarding/experience:
    post:
      operationId: postOnboardingExperience
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postOnboardingExperience_request"
        required: true
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Onboarding step 2: experience"
      tags:
      - onboarding
  /onboarding/interests:
    post:
      operationId: postOnboardingInterests
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postOnboardingInterests_request"
        required: true
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Onboarding step 3: skills from the shared taxonomy"
      tags:
      - onboarding
  /payouts:
    get:
      operationId: getPayouts
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "The researcher's payout method, payout compliance, and payout history"
      tags:
      - payouts
  /payouts/method:
    post:
      operationId: postPayoutsMethod
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postPayoutsMethod_request"
        required: true
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Save the researcher's default payout method (account details are sealed)
      tags:
      - payouts
  /payouts/preferences:
    post:
      operationId: postPayoutsPreferences
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postPayoutsPreferences_request"
        required: true
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Save the researcher's payout hold and minimum-threshold preferences
      tags:
      - payouts
  /profile/certifications:
    get:
      operationId: getProfileCertifications
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCertificationList"
          description: Own certifications with their verification status
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Own certifications with their verification status
      tags:
      - profile
    post:
      operationId: postProfileCertifications
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postProfileCertifications_request"
        required: true
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Submit a certification; issuers with a verification URL are checked\
        \ automatically, others are reviewed manually"
      tags:
      - profile
  /profile/certifications/{id}/delete:
    post:
      operationId: postProfileCertificationsDelete
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Remove an own certification
      tags:
      - profile
  /profile/external:
    get:
      operationId: getProfileExternal
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofExternalProfileList"
          description: External profiles with their proof-of-control status
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Own external profiles with proof-of-control status; pending challenges
        include the proof token and placement instructions
      tags:
      - profile
    post:
      operationId: postProfileExternal
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postProfileExternal_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofExternalProfile"
          description: The started challenge with its proof token and placement instructions
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Start (or restart) a proof-of-control challenge: place the returned\
        \ proof token on the external profile, then check"
      tags:
      - profile
  /profile/external/{id}/check:
    post:
      operationId: postProfileExternalCheck
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofExternalProfile"
          description: The external profile
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Enqueue an asynchronous proof check for an own open challenge; a verified
        profile is returned unchanged
      tags:
      - profile
  /profile/external/{id}/delete:
    post:
      operationId: postProfileExternalDelete
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Remove an own external profile
      tags:
      - profile
  /profile/external/{id}/revoke:
    post:
      operationId: postProfileExternalRevoke
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofExternalProfile"
          description: The revoked external profile
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Revoke an own verified external profile
      tags:
      - profile
  /reports:
    get:
      operationId: getReports
      parameters:
      - description: Workflow states to include
        explode: true
        in: query
        name: status
        required: false
        schema:
          items:
            enum:
            - new
            - triaging
            - validated
            - accepted
            - fixed
            - closed
            - reopened
            - rejected
            - duplicate
            - draft
            type: string
          type: array
          default: null
        style: form
      - description: "Severities (assessed, else submitted) to include"
        explode: true
        in: query
        name: severity
        required: false
        schema:
          items:
            enum:
            - none
            - low
            - medium
            - high
            - critical
            type: string
          type: array
          default: null
        style: form
      - description: "Free-text search: title substring or report id prefix"
        explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - description: Sort key
        explode: true
        in: query
        name: sort
        required: false
        schema:
          enum:
          - submitted
          - updated
          - severity
          - title
          - engagement
          - status
          type: string
        style: form
      - description: Sort direction
        explode: true
        in: query
        name: dir
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: "Page number, from 1"
        explode: true
        in: query
        name: page
        required: false
        schema:
          type: string
        style: form
      - description: Rows per page
        explode: true
        in: query
        name: size
        required: false
        schema:
          enum:
          - "25"
          - "50"
          - "100"
          type: string
        style: form
      - description: Engagement as org_slug/engagement_slug
        explode: true
        in: query
        name: engagement
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportMyReportList"
          description: One page of the researcher's reports with the filtered total
            and the resolved filter
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "The researcher's own reports: filterable by status, engagement, severity,\
        \ and search, sortable, paginated"
      tags:
      - reports
  /reports/collaborations:
    get:
      operationId: getReportsCollaborations
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportInvitationList"
          description: The researcher's collaboration invitations
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: The researcher's bounty-split collaboration invitations
      tags:
      - reports
  /reports/export:
    get:
      operationId: getReportsExport
      parameters:
      - description: Workflow states to include
        explode: true
        in: query
        name: status
        required: false
        schema:
          items:
            enum:
            - new
            - triaging
            - validated
            - accepted
            - fixed
            - closed
            - reopened
            - rejected
            - duplicate
            - draft
            type: string
          type: array
          default: null
        style: form
      - description: "Severities (assessed, else submitted) to include"
        explode: true
        in: query
        name: severity
        required: false
        schema:
          items:
            enum:
            - none
            - low
            - medium
            - high
            - critical
            type: string
          type: array
          default: null
        style: form
      - description: "Free-text search: title substring or report id prefix"
        explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - description: Sort key
        explode: true
        in: query
        name: sort
        required: false
        schema:
          enum:
          - submitted
          - updated
          - severity
          - title
          - engagement
          - status
          type: string
        style: form
      - description: Sort direction
        explode: true
        in: query
        name: dir
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: "Page number, from 1"
        explode: true
        in: query
        name: page
        required: false
        schema:
