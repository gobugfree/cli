    postEngagementsSubmit_request:
      properties:
        ac:
          description: "CVSS attack complexity: L or H"
          type: string
        av:
          description: "CVSS attack vector: N, A, L, or P"
          type: string
        avail:
          description: "CVSS availability impact: N, L, or H"
          type: string
        conf:
          description: "CVSS confidentiality impact: N, L, or H"
          type: string
        description:
          description: Vulnerability description and root cause (markdown)
          minLength: 1
          type: string
        endpoint:
          description: "Affected endpoint or URL, refines the selected asset. Submitting\
            \ needs this or a scopeEntryId"
          type: string
        impact:
          description: Security impact description
          type: string
        integ:
          description: "CVSS integrity impact: N, L, or H"
          type: string
        origin:
          description: AI-use disclosure
          enum:
          - human
          - ai_assisted
          - ai_agent
          minLength: 1
          type: string
        poc:
          description: "Proof-of-concept payload, exploit code, or evidence reference.\
            \ Required to submit, optional on a draft"
          type: string
        pr:
          description: "CVSS privileges required: N, L, or H"
          type: string
        scope:
          description: "CVSS scope: U or C"
          type: string
        scopeEntryId:
          description: In-scope asset id from the engagement's live scope. Submitting
            needs this or an endpoint
          type: string
        severity:
          description: Claimed severity; empty derives it from the CVSS metrics. Submitting
            needs this or all eight CVSS metrics
          enum:
          - none
          - low
          - medium
          - high
          - critical
          type: string
        steps:
          description: "Reproduction steps, appended to the description"
          type: string
        title:
          description: Vulnerability title
          minLength: 1
          type: string
        ui:
          description: "CVSS user interaction: N or R"
          type: string
        vulnerabilityType:
          description: "Vulnerability classification, e.g. XSS"
          type: string
      required:
      - description
      - origin
      - title
    postListsColumns_request:
