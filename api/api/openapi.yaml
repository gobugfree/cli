      tags:
      - backoffice
  /backoffice/payouts:
    get:
      operationId: getBackofficePayouts
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Payout run queue: eligible and blocked researchers, plus payouts by\
        \ state"
      tags:
      - backoffice
  /backoffice/payouts/run:
    post:
      operationId: postBackofficePayoutsRun
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Run payouts: create one payout per eligible researcher (async, idempotent)"
      tags:
      - backoffice
  /backoffice/payouts/{id}/approve:
    post:
      operationId: postBackofficePayoutsApprove
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Approve a pending payout
      tags:
      - backoffice
  /backoffice/payouts/{id}/fail:
    post:
      operationId: postBackofficePayoutsFail
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Mark a processing payout failed with a reason
      tags:
      - backoffice
  /backoffice/payouts/{id}/paid:
    post:
      operationId: postBackofficePayoutsPaid
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Mark a processing payout paid; flips its source rewards to paid
      tags:
      - backoffice
  /backoffice/payouts/{id}/process:
    post:
      operationId: postBackofficePayoutsProcess
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Start processing an approved payout
      tags:
      - backoffice
  /backoffice/payouts/{id}/reject:
    post:
      operationId: postBackofficePayoutsReject
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Cancel a pending payout
      tags:
      - backoffice
