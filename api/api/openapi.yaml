openapi: 3.1.0
info:
  title: application
  version: 3.x
servers:
- url: http://localhost:3000
security:
- bearer: []
paths:
  /advisories/{disclosure_id}:
    get:
      operationId: getAdvisoriesByDisclosureId
      parameters:
      - explode: false
        in: path
        name: disclosure_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisclosureAdvisory"
          description: The public advisory
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: The public advisory of a published disclosure; 404 until published
      tags:
      - advisories
  /backoffice/badges:
    get:
      operationId: getBackofficeBadges
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeList"
          description: Every badge with its criteria configuration
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Staff badge catalog: every badge including inactive ones"
      tags:
      - backoffice
    post:
      operationId: postBackofficeBadges
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postBackofficeBadges_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Badge"
          description: The created badge
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Create a badge; the code is stable, names and descriptions are per-locale\
        \ with English required, and the criteria kind with threshold and parameters\
        \ defines the earning logic"
      tags:
      - backoffice
  /backoffice/badges/{code}:
    get:
      operationId: getBackofficeBadgesByCode
      parameters:
      - explode: false
        in: path
        name: code
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The badge and its award holders
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: One badge with its holders
      tags:
      - backoffice
    post:
      operationId: postBackofficeBadgesByCode
      parameters:
      - explode: false
        in: path
        name: code
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postBackofficeBadges_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Badge"
          description: The updated badge
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Update a badge's texts, visuals, and criteria; the code cannot change"
      tags:
      - backoffice
  /backoffice/badges/{code}/award:
    post:
      operationId: postBackofficeBadgesAward
      parameters:
      - explode: false
        in: path
        name: code
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postBackofficeBadgesAward_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Badge"
          description: The badge after awarding
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Manually award a badge to a researcher by handle or email; idempotent,\
        \ and the researcher is notified only on a new award"
      tags:
      - backoffice
  /backoffice/badges/{code}/awards/{award_id}/revoke:
    post:
      operationId: postBackofficeBadgesAwardsRevoke
      parameters:
      - explode: false
        in: path
        name: code
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: award_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Revoke one badge award; audited
      tags:
      - backoffice
  /backoffice/badges/{code}/deactivate:
    post:
      operationId: postBackofficeBadgesDeactivate
      parameters:
      - explode: false
        in: path
        name: code
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Deactivate a badge: it disappears from the researcher catalog and\
        \ profiles and stops being awarded; existing awards are kept"
      tags:
      - backoffice
  /backoffice/badges/{code}/reactivate:
    post:
      operationId: postBackofficeBadgesReactivate
      parameters:
      - explode: false
        in: path
        name: code
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Reactivate a previously deactivated badge
      tags:
      - backoffice
  /backoffice/budgets:
    get:
      operationId: getBackofficeBudgets
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsBudgets"
          description: The budget configuration
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "The pending-report budget configuration: per-tier limits, slop-rejection\
        \ penalties, and active per-researcher overrides"
      tags:
      - backoffice
  /backoffice/budgets/overrides:
    post:
      operationId: postBackofficeBudgetsOverrides
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postBackofficeBudgetsOverrides_request"
        required: true
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Create a per-researcher budget override with a mandatory reason and
        optional expiry
      tags:
      - backoffice
  /backoffice/budgets/overrides/{id}/delete:
    post:
      operationId: postBackofficeBudgetsOverridesDelete
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Remove a budget override; the tier limit applies again
      tags:
      - backoffice
  /backoffice/budgets/penalties:
    post:
      operationId: postBackofficeBudgetsPenalties
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Update the spam/ai_slop rejection penalty points (always negative)
      tags:
      - backoffice
  /backoffice/budgets/tiers:
    post:
      operationId: postBackofficeBudgetsTiers
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Update the per-tier pending-report limits; empty means unlimited,\
        \ limits must not decrease on higher tiers"
      tags:
      - backoffice
  /backoffice/certifications:
    get:
      operationId: getBackofficeCertifications
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Staff review queue of claimed researcher certifications
      tags:
      - backoffice
  /backoffice/certifications/{id}/reject:
    post:
      operationId: postBackofficeCertificationsReject
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postBackofficeCertificationsReject_request"
        required: true
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Reject a claimed certification (staff decision, audit-logged)"
      tags:
      - backoffice
  /backoffice/certifications/{id}/verify:
    post:
      operationId: postBackofficeCertificationsVerify
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postBackofficeCertificationsReject_request"
        required: true
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Verify a claimed certification (staff decision, audit-logged)"
      tags:
      - backoffice
  /backoffice/compliance:
    get:
      operationId: getBackofficeCompliance
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Researcher payout compliance (sanctions) for the backoffice stopgap
      tags:
      - backoffice
  /backoffice/compliance/{user_id}:
    post:
      operationId: postBackofficeComplianceByUserId
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postBackofficeComplianceByUserId_request"
        required: true
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Set a researcher's sanctions status
      tags:
      - backoffice
  /backoffice/conduct:
    get:
      operationId: getBackofficeConduct
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConductCaseList"
          description: The conduct cases
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: The trust & safety conduct case queue
      tags:
      - backoffice
    post:
      operationId: postBackofficeConduct
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Open a conduct case against a researcher
      tags:
      - backoffice
  /backoffice/conduct/report/{report_id}/flag:
    post:
      operationId: postBackofficeConductReportFlag
      parameters:
      - explode: false
        in: path
        name: report_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Open a conduct case pre-linked to a report and its researcher
      tags:
      - backoffice
  /backoffice/conduct/{case_id}:
    get:
      operationId: getBackofficeConductByCaseId
      parameters:
      - explode: false
        in: path
        name: case_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConductCase"
          description: The conduct case
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: One conduct case with its enforcement actions and appeals
      tags:
      - backoffice
  /backoffice/conduct/{case_id}/appeal/{appeal_id}/resolve:
    post:
      operationId: postBackofficeConductAppealResolve
      parameters:
      - explode: false
        in: path
        name: case_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: appeal_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Uphold or overturn a conduct appeal
      tags:
      - backoffice
  /backoffice/conduct/{case_id}/close:
    post:
      operationId: postBackofficeConductClose
      parameters:
      - explode: false
        in: path
        name: case_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Close a decided conduct case
      tags:
      - backoffice
  /backoffice/conduct/{case_id}/decide:
    post:
      operationId: postBackofficeConductDecide
      parameters:
      - explode: false
        in: path
        name: case_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Decide a conduct case
      tags:
      - backoffice
  /backoffice/conduct/{case_id}/dismiss:
    post:
      operationId: postBackofficeConductDismiss
      parameters:
      - explode: false
        in: path
        name: case_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Dismiss a conduct case
      tags:
      - backoffice
  /backoffice/conduct/{case_id}/enforce:
    post:
      operationId: postBackofficeConductEnforce
      parameters:
      - explode: false
        in: path
        name: case_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Record a graduated enforcement action on a decided case
      tags:
      - backoffice
  /backoffice/conduct/{case_id}/enforce/{action_id}/revoke:
    post:
      operationId: postBackofficeConductEnforceRevoke
      parameters:
      - explode: false
        in: path
        name: case_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: action_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Lift an active enforcement action
      tags:
      - backoffice
  /backoffice/conduct/{case_id}/note:
    post:
      operationId: postBackofficeConductNote
      parameters:
      - explode: false
        in: path
        name: case_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Add an investigation note to a case
      tags:
      - backoffice
  /backoffice/conduct/{case_id}/take-up:
    post:
      operationId: postBackofficeConductTakeUp
      parameters:
      - explode: false
        in: path
        name: case_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Take up a conduct case for investigation
      tags:
      - backoffice
  /backoffice/customer-onboarding:
    get:
      operationId: getBackofficeCustomerOnboarding
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomeronboardingRequestList"
          description: The onboarding requests
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "The back-office queue of customer onboarding requests, filterable\
        \ by status and customer email"
      tags:
      - backoffice
    post:
      operationId: postBackofficeCustomerOnboarding
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postBackofficeCustomerOnboarding_request"
        required: true
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Create a prefilled customer onboarding request and get its share link
        for the customer
      tags:
      - backoffice
  /backoffice/customer-onboarding/{request_id}/reject:
    post:
      operationId: postBackofficeCustomerOnboardingReject
      parameters:
      - explode: false
        in: path
        name: request_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/postBackofficeCustomerOnboardingReject_request"
        required: true
      responses:
        "200":
          description: "JSON when the request accepts application/json, HTML otherwise."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Reject a customer onboarding request with an optional note; 409 once
        it is closed
      tags:
      - backoffice
  /backoffice/feedback:
    get:
      operationId: getBackofficeFeedback
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackList"
          description: The feedback entries
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "The product feedback queue, optionally filtered by status"
