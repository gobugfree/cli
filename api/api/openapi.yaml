          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: "Move a feedback entry to new, reviewed, or resolved"
      tags:
      - backoffice
  /backoffice/organizations:
    get:
      operationId: getBackofficeOrganizations
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsOrganizationRowList"
          description: The organizations with their engagement counts
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Every customer and partner organization with verification status and
