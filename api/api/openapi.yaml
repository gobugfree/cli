  securitySchemes:
    bearer:
      bearerFormat: JWT
      description: Access token issued to the user by the OAuth 2.0 device authorization
        grant (RFC 8628); x-device-flow lists the endpoints.
      scheme: bearer
      type: http
      x-device-flow:
        clientId: agent
        deviceAuthorizationUrl: https://id.gobugfree.com/realms/gobugfree/protocol/openid-connect/auth/device
        issuer: https://id.gobugfree.com/realms/gobugfree
        scopes:
        - openid
        - profile
        tokenUrl: https://id.gobugfree.com/realms/gobugfree/protocol/openid-connect/token
