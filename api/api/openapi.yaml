  securitySchemes:
    bearer:
      bearerFormat: JWT
      description: Access token issued to the user by the OAuth 2.0 device authorization
        grant (RFC 8628); x-device-flow lists the endpoints.
      scheme: bearer
      type: http
      x-device-flow:
        clientId: agent
        deviceAuthorizationUrl: http://localhost:8080/realms/gbf/protocol/openid-connect/auth/device
        issuer: http://localhost:8080/realms/gbf
        scopes:
        - openid
        - profile
        tokenUrl: http://localhost:8080/realms/gbf/protocol/openid-connect/token
